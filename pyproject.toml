[project]
name = "llm-memory-mastery"
version = "0.1.0"
description = "Beginner-friendly LangChain, LangGraph, and Groq memory project"
readme = "README.md"
authors = [
    { name = "Mukul", email = "kansalmukul@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "ddgs>=9.16.1",
    "greenlet>=3.1.1",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langmem>=0.0.30",
    "python-dotenv>=1.2.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
llm-memory-mastery = "llm_memory_mastery:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
